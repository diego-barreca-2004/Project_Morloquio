[project]
name = "morloquio"
version = "0.1.0"
description = "Mappa aperta e automatica di tutte le strade e i sentieri del mondo, da soli dati open."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "geopandas>=1.2.0",
    "httpx>=0.28.1",
    "mercantile>=1.2.1",
    "numba>=0.68.1",
    "numpy>=2.5.5",
    "osmium>=4.3.2",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "pyogrio>=0.13.0",
    "pyproj>=3.8.0",
    "pystac-client>=0.9.1",
    "pyyaml>=6.0.4",
    "rasterio>=1.5.2",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "skan>=0.13.1",
    "torch==2.14.1",
]

[project.scripts]
morloquio = "morloquio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/morloquio"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["morloquio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: test che usano la rete e servizi esterni reali (esclusi di default)",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

# PyTorch con CUDA 13.0 (RTX 5070 Ti, Blackwell): indice ufficiale PyTorch, usato solo per torch.
# I pacchetti nvidia-* che porta con sé sono strato di sistema (spec §3.6, configs/license_overrides.yaml).
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
